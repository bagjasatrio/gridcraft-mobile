[package]
name = "gridcraft-android-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Throwaway Android spike for GridCraft (single viewport, native eframe/wgpu)"

# Deliberately no `[lints] workspace = true`: `android_main` needs `#[unsafe(no_mangle)]`
# and the workspace forbids `unsafe_code` (see eframe's own hello_android example).

[lib]
# cdylib for Android, rlib so a desktop `cargo run` still works.
crate-type = ["cdylib", "lib"]

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
winit = { version = "0.30", default-features = false }

[package.metadata.android]
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
package = "ai.storyteller.gridcraft.spike"
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
# 35 forces edge-to-edge, so the app must draw its own system-bar insets; 34 keeps the
# decor fitting the system bars until inset handling lands (see README).
target_sdk_version = 34

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "GridCraft"
theme = "@android:style/Theme.Material.Light.NoActionBar"

[package.metadata.android.application.activity]
orientation = "unspecified"

[package.metadata.android.signing.release]
path = "C:/Users/ASUS/.android/debug.keystore"
key_alias = "androiddebugkey"
key_password = "android"
keystore_password = "android"
